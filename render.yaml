# Render Blueprint: deploys the free (512 MB) plan straight from GitHub.
# Render dashboard > New > Blueprint > pick this repo.
services:
  - type: web
    name: notegenius
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: QA_BACKEND
        value: search
